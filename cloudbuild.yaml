steps:
  # Build and push container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'asia-southeast2-docker.pkg.dev/webaisiber/waspadasiber/api:$COMMIT_SHA'
      - './server'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'asia-southeast2-docker.pkg.dev/webaisiber/waspadasiber/api:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - waspadasiber-api
      - '--image=asia-southeast2-docker.pkg.dev/webaisiber/waspadasiber/api:$COMMIT_SHA'
      - '--region=asia-southeast2'
      - '--platform=managed'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=60'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=webaicyber'

images:
  - 'asia-southeast2-docker.pkg.dev/webaisiber/waspadasiber/api:$COMMIT_SHA'
